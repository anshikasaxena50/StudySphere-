<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySphere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🤖 StudySphere</h1>
    <p>Your personal study helper</p>

    <input
        type="text"
        id="question"
        placeholder="Ask a study question..."
    >

    <div class="main-buttons">

        <button onclick="showAskAI()">
            Ask AI
        </button>

        <button onclick="showNotes()">
            📝 Make Notes
        </button>

        <button onclick="showHandwritten()">
            ✍️ Handwritten Notes
        </button>

    </div>


    <!-- NOTES CONTROLS -->

    <div id="notesControls" class="controls hidden">

        <label>Page Number:</label>

        <select id="notesPageNumber">

            <option value="1">1 Page</option>
            <option value="2">2 Pages</option>
            <option value="3">3 Pages</option>
            <option value="4">4 Pages</option>
            <option value="5">5 Pages</option>
            <option value="custom">Custom</option>

        </select>

        <input
            type="number"
            id="customNotesPages"
            min="1"
            max="20"
            placeholder="Enter pages"
            class="hidden"
        >

    </div>


    <!-- HANDWRITTEN CONTROLS -->

    <div id="handwrittenControls" class="controls hidden">

        <label>Page Number:</label>

        <select id="handwrittenPageNumber">

            <option value="1">1 Page</option>
            <option value="2">2 Pages</option>
            <option value="3">3 Pages</option>
            <option value="4">4 Pages</option>
            <option value="5">5 Pages</option>
            <option value="custom">Custom</option>

        </select>

        <input
            type="number"
            id="customHandwrittenPages"
            min="1"
            max="20"
            placeholder="Enter pages"
            class="hidden"
        >


        <label>Page Background:</label>

        <select id="pageBackground">

            <option value="lined">Lined Paper</option>
            <option value="plain">Plain Paper</option>
            <option value="grid">Grid Paper</option>
            <option value="yellow">Yellow Notebook</option>

        </select>


        <label>Font:</label>

        <select id="handwrittenFont">

            <option value="hand1">Handwriting 1</option>
            <option value="hand2">Handwriting 2</option>
            <option value="hand3">Handwriting 3</option>

        </select>

    </div>


    <div id="answer"></div>


    <script src="script.js?v=6"></script>

</body>

</html>
